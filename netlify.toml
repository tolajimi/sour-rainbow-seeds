# Netlify configuration for Sour Rainbow Seed Co.
# Static site — no build step required

[build]
  command = ""
  publish = "."

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache CSS/JS for 1 hour only (not immutable) so updates show up quickly
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# IMPORTANT: No SPA catch-all redirect.
# A /* → /index.html rule can make CSS/JS requests return HTML and break the site.
