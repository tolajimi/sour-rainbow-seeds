# Netlify configuration for Sour Rainbow Seed Co.
# Static site — no build step required

[build]
  # No build command needed (pure HTML/CSS/JS)
  command = ""
  # Publish the repository root
  publish = "."

# Optional: nicer headers & security defaults
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets aggressively
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA-style fallback (not strictly needed here, but harmless)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
